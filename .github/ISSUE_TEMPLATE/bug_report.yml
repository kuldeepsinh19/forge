name: Bug report
description: Something behaved differently from what you expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here. Use a private advisory
        instead — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what happened, and what you expected instead.
      placeholder: |
        I ran: forge run --dry-run "..."
        I expected: ...
        Instead: ...
    validations:
      required: true
  - type: textarea
    id: repository
    attributes:
      label: The repository you ran it against
      description: >
        Language, rough size, package manager, anything unusual about the layout.
        The output of `forge inspect` is ideal. Do not paste private source.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Forge version
      description: Output of `forge --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Node version
      placeholder: "macOS 15.1, Node 22.3.0"
    validations:
      required: true
  - type: textarea
    id: telemetry
    attributes:
      label: Run summary (optional)
      description: >
        If the run produced `.forge/runs/<timestamp>/summary.json`, it is useful here.
        It contains token counts and costs, never prompt or response text.
      render: json
